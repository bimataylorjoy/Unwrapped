name: CI
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The sandbox tests build each contract through the `cargo near` CLI.
      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
          cargo near --version
      - name: Unit and sandbox tests
        run: |
          set -o pipefail
          ./scripts/test.sh 2>&1 | tee test-output.log
      - name: Report test failures
        if: failure()
        run: ./scripts/ci-report-failure.sh test-output.log
